services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    ports:
      - "8080:8080"
      - "127.0.0.1:2345:2345"
    volumes:
      - ./src/data:/data
      - .:/src
      - go-cache:/root/.cache/go-build
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  sqlite-data:
  go-cache:
