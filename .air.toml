root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -gcflags='all=-N -l' -o /tmp/api ."
bin = "/tmp/api"
full_bin = "dlv exec /tmp/api --headless --listen=:2345 --api-version=2 --accept-multiclient --continue"

include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "data"]

# Poll Windows bind mounts because filesystem change events may not reach Docker.
poll = true
poll_interval = 500

delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
